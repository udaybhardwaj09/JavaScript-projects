<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

<main class="weatherApp">

    <header class="navBar">

        <div></div>
        
        <div class="searchGroup">
            <input
            type="text"
            class="searchInput"
            placeholder="Search city..."
            >

            <button class="searchBtn">
                🔍
            </button>
        </div>

        <button class="locationBtn">
            📍 Current Location
        </button>

    </header>

    <section class="welcomeScreen">

        <div class="welcomeContent">

            <span class="welcomeIcon">☁️</span>

            <h1>Welcome to Weather</h1>

            <p>Search for a city to see the weather</p>

        </div>

    </section>

    <section class="weatherMain">

        <section class="currentWeather">

            <p class="city"></p>

            <p class="date"></p>

            <h1 class="temperature"></h1>

            <p class="description"></p>

            <p class="highLow"></p>

        </section>

        <section class="forecast">

            <p id="forecastHead">5 Day Forecast</p>

            <div class="forecastList">

                <div class="day">
                    <p></p>
                    <span></span>
                    <p></p>
                    <p></p>
                </div>

                <div class="day">
                    <p></p>
                    <span></span>
                    <p></p>
                    <p></p>
                </div>

                <div class="day">
                    <p></p>
                    <span></span>
                    <p></p>
                    <p></p>
                </div>

                <div class="day">
                    <p></p>
                    <span></span>
                    <p></p>
                    <p></p>
                </div>

                <div class="day">
                    <p></p>
                    <span></span>
                    <p></p>
                    <p></p>
                </div>

            </div>

        </section>

    </section>

    <section class="attributes">

        <div class="attributeCard">
            <p>Humidity</p>
            <h3 class="humidityValue">%</h3>
        </div>

        <div class="attributeCard">
            <p>Wind</p>
            <h3 class="windValue"></h3>
        </div>

        <div class="attributeCard">
            <p>Pressure</p>
            <h3 class="pressureValue">hPa</h3>
        </div>

        <div class="attributeCard">
            <p>Feels Like</p>
            <h3 class="feelsLikeValue">°C</h3>
        </div>

    </section>

    <section class="hourlyForecast">

        <p id="hourlyHead">Hourly Forecast</p>

        <div class="hourlyCards">

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

            <div class="hourCard">
                <p></p>
                <span></span>
                <p>°C</p>
            </div>

        </div>

    </section>

</main>

</body>
</html>
